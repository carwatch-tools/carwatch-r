name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        r: ['4.3', 'release']
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: 'check'
          extra-packages: any::covr, any::shinytest2
      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: 'warning'

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: 'check'
          extra-packages: any::pkgdown
      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site(override = list(destination = tempfile("pkgdown-")))'
