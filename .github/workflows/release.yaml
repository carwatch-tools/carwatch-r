name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }}, R ${{ matrix.r }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            r: 'release'
          - os: ubuntu-latest
            r: '4.3'
          - os: ubuntu-latest
            r: 'release'
          - os: ubuntu-latest
            r: 'devel'
          - os: windows-latest
            r: 'release'
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Validate release metadata
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            Rscript tools/check_release_metadata.R "${GITHUB_REF_NAME}"
          else
            Rscript tools/check_release_metadata.R
          fi
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'

  build:
    name: Build release archive
    needs: check
    runs-on: ubuntu-latest
    outputs:
      archive: ${{ steps.archive.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - name: Build source package
        run: R CMD build .
      - name: Locate source archive
        id: archive
        shell: bash
        run: |
          archive=$(find . -maxdepth 1 -name 'carwatch_*.tar.gz' -print -quit)
          test -n "${archive}"
          archive=${archive#./}
          echo "name=${archive}" >> "${GITHUB_OUTPUT}"
      - name: Check the release archive
        run: R CMD check --no-manual --as-cran "${{ steps.archive.outputs.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: carwatch-source-package
          path: ${{ steps.archive.outputs.name }}
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tags must point to a commit on main." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: carwatch-source-package
      - name: Create release and attach source archive
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ needs.build.outputs.archive }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ARCHIVE}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${ARCHIVE}" \
              --verify-tag \
              --generate-notes \
              --title "carwatch ${GITHUB_REF_NAME#v}"
          fi
