url: https://carwatch-tools.github.io/carwatch-r
template:
  bootstrap: 5
reference:
  - title: Data import and conversion
    contents:
      - starts_with("read_")
      - starts_with("write_")
      - convert_raw_logs
      - starts_with("extract_")
      - summarize_protocol
      - summarize_source_audit
  - title: Compliance and analysis
    contents:
      - merge_saliva
      - summarize_compliance
      - find_non_compliant_samples
      - drop_non_compliant_samples
      - find_sampling_anomalies
      - starts_with("compute_")
      - auc
      - slope
      - starts_with("plot_")
  - title: Interactive review
    contents:
      - interactive_sampling_timeline
      - conversion_report_editor
  - title: Synthetic data
    contents:
      - starts_with("generate_synthetic_")
  - title: Results and feature helpers
    contents:
      - new_carwatch_results
      - as_study_days
      - as_sample_events
      - new_sampling_compliance_checker
      - initial_value
      - max_value
      - max_increase
      - mean_se
      - standard_features
      - saliva_feature_wide_to_long
      - sample_times_datetime_to_minute
