url: https://carwatch-tools.github.io/carwatch-r
template:
  bootstrap: 5
reference:
  - title: Data import and conversion
    contents:
      - starts_with("read_")
      - convert_raw_logs
      - starts_with("extract_")
      - summarize_protocol
  - title: Analysis
    contents:
      - merge_saliva
      - starts_with("compute_")
      - auc
      - slope
      - starts_with("plot_")
